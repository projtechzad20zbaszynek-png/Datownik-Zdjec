name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name Datownik_Zdjec_FINAL app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Datownik_Zdjec_FINAL_Windows
          path: dist/Datownik_Zdjec_FINAL.exe
